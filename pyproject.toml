[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-engine"
version = "0.1.0"
description = "GPU-first LLM inference engine with Triton kernels, INT8 quantization, and speculative decoding"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "transformers>=5.12.1",
    "pytest>=9.0.3",
    "accelerate>=1.14.0",
]

[project.optional-dependencies]
gpu = ["triton>=2.1"]
tokenizer = ["tokenizers>=0.15"]
dev = ["pytest>=7", "pytest-xdist"]

[tool.setuptools.packages.find]
include = ["engine*", "kernels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "no_cuda: tests that do not require a GPU",
    "integration: tests that download or run against HuggingFace checkpoints",
]
