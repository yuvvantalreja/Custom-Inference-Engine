[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-engine"
version = "0.1.0"
description = "Custom-kernel LLM inference engine with INT8 quantization and speculative decoding"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
gpu = ["triton>=2.1"]
tokenizer = ["tokenizers>=0.15"]
dev = ["pytest>=7", "pytest-xdist"]

[tool.setuptools.packages.find]
include = ["engine*", "kernels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
